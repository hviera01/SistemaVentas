<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sistema de ventas, compras e inventario de SUPERCOLOR.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SUPERCOLOR">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SUPERCOLOR - Sistema de Ventas</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <style>
    #cargando { position: fixed; inset: 0; background: #0F1B3D; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; transition: opacity .4s; }
    #cargando img { width: 168px; height: 168px; border-radius: 28px; }
    #cargando p { color: #cfcfcf; font: 500 14px system-ui, sans-serif; margin: 22px 0 0; letter-spacing: .3px; }
    #cargando .barra { width: 150px; height: 3px; background: rgba(255,255,255,.15); border-radius: 3px; margin-top: 14px; overflow: hidden; }
    #cargando .barra i { display: block; width: 40%; height: 100%; background: #E0A83A; border-radius: 3px; animation: ir 1.1s ease-in-out infinite; }
    @keyframes ir { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  </style>
  <div id="cargando">
    <img src="icons/Icon-192.png" alt="Super Color">
    <p>Cargando el sistema…</p>
    <div class="barra"><i></i></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var c = document.getElementById('cargando');
      if (!c) return;
      c.style.opacity = '0';
      setTimeout(function () { c.remove(); }, 450);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
